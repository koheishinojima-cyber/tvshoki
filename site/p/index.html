<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品ページ（テンプレート）｜テレビでみた</title>
  <meta name="description" content="テレビで紹介された商品ページの空テンプレート。実在の商品は載せていません。">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <p class="brand"><a href="../">テレビでみた</a></p>
  </header>
  <main>
    <p class="template-note">これは空のテンプレートです。実在の商品・番組は載せていません。</p>
    <article class="item">
      <h1>紹介された商品</h1>
      <dl class="item-fields">
        <dt>番組名</dt>
        <dd>—</dd>
        <dt>放送日</dt>
        <dd>—</dd>
        <dt>紹介された商品</dt>
        <dd>—</dd>
        <dt>画像</dt>
        <dd>
          <!-- optional: <img src="" alt=""> -->
          （任意・未設定）
        </dd>
        <dt>ブランド</dt>
        <dd>—</dd>
        <dt>商品名</dt>
        <dd>—</dd>
        <dt>根拠URL</dt>
        <dd>—</dd>
        <dt>価格帯</dt>
        <dd>—</dd>
        <dt>送料事実</dt>
        <dd>—</dd>
      </dl>
      <!-- Production tracking URL is injected at publish time. Leave href="#" in this repo. Do not commit a live hb.afl URL or invent a Rakuten ID. -->
      <p class="cta-wrap"><a class="cta" href="#">商品を見る</a></p>
    </article>
  </main>
  <footer class="site-footer">
    <p>テレビでみた</p>
  </footer>
</body>
</html>
